name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and portable build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run quality gate
        shell: pwsh
        run: .\eng\quality.ps1

      - name: Check NuGet vulnerabilities
        shell: pwsh
        run: .\eng\assert-no-vulnerable-packages.ps1

      - name: Publish portable application
        shell: pwsh
        run: >
          dotnet publish .\AngelBossKey.Next.App\AngelBossKey.Next.App.csproj
          --configuration Release
          --no-restore
          -p:PublishProfile=Portable
          -p:PublishDir=${{ github.workspace }}\artifacts\portable\

      - name: Upload portable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AngelBossKey.Next-portable
          path: artifacts/portable
          if-no-files-found: error
          retention-days: 7
