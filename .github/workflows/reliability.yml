name: Reliability stress

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:
    inputs:
      seeds:
        description: Number of deterministic audio-model seeds
        required: true
        default: 256
        type: number
      steps:
        description: Operations generated for each seed
        required: true
        default: 500
        type: number
      window_cycles:
        description: Synthetic HWND hide and restore cycles
        required: true
        default: 1000
        type: number
      base_seed:
        description: First signed 32-bit model seed
        required: true
        default: 4301281
        type: number

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: Model and lifecycle stress
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run reliability stress profile
        shell: pwsh
        env:
          RELIABILITY_SEEDS: ${{ inputs.seeds || 256 }}
          RELIABILITY_STEPS: ${{ inputs.steps || 500 }}
          RELIABILITY_WINDOW_CYCLES: ${{ inputs.window_cycles || 1000 }}
          RELIABILITY_BASE_SEED: ${{ inputs.base_seed || 4301281 }}
        run: |
          .\eng\reliability.ps1 `
            -Seeds ([int]$env:RELIABILITY_SEEDS) `
            -Steps ([int]$env:RELIABILITY_STEPS) `
            -WindowCycles ([int]$env:RELIABILITY_WINDOW_CYCLES) `
            -BaseSeed ([int]$env:RELIABILITY_BASE_SEED)

      - name: Upload reliability results and reproduction traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/reliability
          if-no-files-found: error
          retention-days: 14
